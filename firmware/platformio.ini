; PaperMono Shopping List firmware.
; Build: pio run        Flash: pio run -t upload        Logs: pio device monitor
; See ../docs/firmware.md.

[platformio]
default_envs = papermono

[env:papermono]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; 8 MB octal PSRAM: M5GFX won't drive the panel without it.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

build_flags =
    -I src
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    ; Reported to the server on every sync (X-Firmware-Version); the server decides whether to offer an
    ; OTA update. Bump it for every build you publish - see docs/server.md#firmware-updates-ota.
    -D FW_VERSION=\"1.6.0\"
    ; The /api/sync response is parsed on the loop task, with HTTPClient and ArduinoJson buffers
    ; stacked on top of the UI's drawing code; the default 8 KB isn't enough.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -O2

; Warnings for this project's sources only (not the libraries).
build_src_flags = -Wall -Wextra

monitor_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.21
    m5stack/M5GFX @ ^0.2.26
    m5stack/M5PM1 @ ^1.0.7
    m5stack/M5IOE1 @ ^1.0.9
    bblanchon/ArduinoJson @ ^7.1.0
